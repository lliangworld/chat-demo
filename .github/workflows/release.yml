# ============================================================================
# 发布构建：Windows 单文件 exe + Android APK（本文件只存在于 release 分支）
#
# 使用方式（main 保持与上游同步、零改动，所有发布动作都在 release 分支上）：
#   1. 正式发布：在 release 分支上打 tag 并推送，自动构建并创建 GitHub Release：
#        git tag v1.0.0-20261116 && git push origin v1.0.0-20261116
#      tag 格式：v<semver>-<YYYYMMDD>（第一个版本 v1.0.0-20261116）。
#      注意：tag 必须指向包含本 workflow 的 release 分支提交；打在 main 上
#      不会触发（main 上没有本文件，天然防误触）。
#   2. 手动构建（只出 Actions Artifacts，不创建 Release）：
#        gh workflow run release.yml --ref release
#        可选 -f version=1.0.0-20261116（合法 semver），留空为 0.0.0-snapshot.<run_number>
#   3. 上游同步：GitHub "Sync fork" 更新 main → 把 main 合并进 release → 打新 tag。
#      release 分支不修改 package.json 等上游文件，合并不会产生冲突。
#
# 版本规则：tag 剥离前缀 v 即产物版本（v1.0.0-20261116 → 1.0.0-20261116）；
#   Android versionCode 取末尾 8 位日期（单调递增）。
#
# 桌面 exe：Tauri 2 原生壳（Rust + 系统 WebView2），CI 生成脚手架并内嵌 dist，
#   产物为单文件 exe（约 5MB），双击即用；Win10 1803+/Win11 自带 WebView2。
#   外链自动转系统浏览器打开；麦克风免权限弹窗；原生 GUI 窗口（无控制台）。
#   数据存放于独立 WebView2 profile（与浏览器、旧版 Go exe、APK 互不相通）：
#     API Key 与设置：%LOCALAPPDATA%\io.github.lliangworld.chatdemo\EBWebView\Default\Local Storage\leveldb\
#     对话与附件：     %LOCALAPPDATA%\io.github.lliangworld.chatdemo\EBWebView\Default\IndexedDB\http_tauri.localhost_0.indexeddb.leveldb\
#   删除/替换 exe 不丢数据；重装保留；备份=退出应用后拷贝上述目录；清除=删除 EBWebView。
#
# 已知限制：产物未签名（SmartScreen / Play Protect 会提示，正常）；APK 为 CI
#   临时 debug 签名，升级安装需先卸载旧版，且不能上架商店；Tauri exe 首次构建
#   冷编译 Rust 约 15-25 分钟（有 cargo 缓存后约 2-4 分钟）。
# ============================================================================

name: Release Builds (exe & APK)

on:
  push:
    tags:
      - 'v*-*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（合法 semver，如 1.0.0-20261116），留空用 0.0.0-snapshot.<run_number>'
        required: false
        type: string
      diagnostics:
        description: '仅构建 APK 并注入诊断浮层（显示 frame 高度/视口单位实测值），用于排查 APK 白屏；跳过 exe 与 Release'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  # ---------------------------------------------------------------------------
  # Windows 单文件 exe：pnpm 构建静态站点 → CI 生成 Tauri 2 脚手架（Rust 壳内嵌
  # dist）→ 原生单文件 exe（约 5MB，依赖系统 WebView2，Win10 1803+/Win11 自带）。
  # ---------------------------------------------------------------------------
  build-tauri-exe:
    name: Windows exe (Tauri native shell)
    runs-on: windows-latest
    timeout-minutes: 45
    # 诊断模式只构建 APK，跳过 exe
    if: github.event_name != 'workflow_dispatch' || inputs.diagnostics != true
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve version
        id: version
        env:
          VERSION_INPUT: ${{ inputs.version }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag="$GITHUB_REF_NAME"
            if ! echo "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+-[0-9]{8}$'; then
              echo "::error::tag '$tag' 不符合格式 v<semver>-<YYYYMMDD>，例如 v1.0.0-20261118"
              exit 1
            fi
            version="${tag#v}"
            datecode="${tag##*-}"
            if ! date -d "${datecode:0:4}-${datecode:4:2}-${datecode:6:2}" >/dev/null 2>&1; then
              echo "::error::tag 日期段 '$datecode' 不是合法日期"
              exit 1
            fi
          else
            version="${VERSION_INPUT:-0.0.0-snapshot.${RUN_NUMBER}}"
            datecode="$(date +%Y%m%d)"
            if ! echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
              echo "::error::版本号 '$version' 不是合法 semver（示例：1.0.0-20261118）"
              exit 1
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "datecode=$datecode" >> "$GITHUB_OUTPUT"
          echo "构建版本：$version（versionCode/日期码：$datecode）"

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.6.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check types
        run: pnpm type

      - name: Lint
        run: pnpm lint

      # 注意：不能用 pnpm build——pnpm 在 Windows 上用 cmd.exe 执行脚本，
      # “NODE_ENV=production ...” 前缀语法会失败；这里在 bash 中等价直调
      - name: Build web app
        run: |
          set -euo pipefail
          rm -rf dist
          NODE_ENV=production pnpm exec rspack build -c rspack.config.ts

      - name: Generate placeholder icon
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/.tauri-pack"
          cd "$GITHUB_WORKSPACE/.tauri-pack"
          cat > icon.svg <<'EOF'
          <svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
            <defs>
              <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#4f8cff"/>
                <stop offset="1" stop-color="#7c5cff"/>
              </linearGradient>
            </defs>
            <rect width="1024" height="1024" rx="220" fill="url(#g)"/>
            <rect x="248" y="264" width="528" height="380" rx="80" fill="#ffffff"/>
            <path d="M400 620 L400 760 L520 620 Z" fill="#ffffff"/>
            <circle cx="412" cy="454" r="34" fill="#4f8cff"/>
            <circle cx="512" cy="454" r="34" fill="#4f8cff"/>
            <circle cx="612" cy="454" r="34" fill="#4f8cff"/>
          </svg>
          EOF
          # 用 pnpm 而非 npm：脚手架位于 workspace 内时，npm 向上探测到项目的
          # pnpm-lock.yaml 会触发 "Cannot read properties of null (reading 'matches')"。
          # 不用 pnpm exec（会走 recursive 模式找不到 bin），直接用 .bin 下的可执行文件。
          pnpm init >/dev/null
          pnpm add -D sharp-cli @tauri-apps/cli@2
          ls node_modules/.bin
          # sharp-cli 包的实际 bin 名是 sharp（不是 sharp-cli）
          node_modules/.bin/sharp -i icon.svg -o icon-1024.png resize 1024 1024
          node_modules/.bin/tauri icon icon-1024.png --output tauri-icons
          ls -l tauri-icons

      - name: Scaffold Tauri project
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/.tauri-pack"
          cp -r "$GITHUB_WORKSPACE/dist" dist
          mkdir -p src-tauri/src src-tauri/capabilities src-tauri/icons
          # tauri-build 在 Windows 上编译期要求 icons/icon.ico 存在（生成资源文件），
          # 因此拷贝 tauri icon 生成的全套图标而非仅 icon.png
          cp -r tauri-icons/* src-tauri/icons/
          # tauri.conf.json 与 Cargo.toml 必须同目录（Tauri 标准布局：src-tauri/），
          # 否则 CLI 在错误的位置找 Cargo.toml；frontendDist 相对 conf 所在目录
          cat > src-tauri/tauri.conf.json <<'EOF'
          {
            "$schema": "https://schema.tauri.app/config/2",
            "productName": "Chat Demo",
            "version": "VERSION_PLACEHOLDER",
            "identifier": "io.github.lliangworld.chatdemo",
            "mainBinaryName": "chatdemo",
            "build": {
              "frontendDist": "../dist"
            },
            "app": {
              "windows": [],
              "security": {
                "csp": null
              }
            },
            "bundle": {
              "active": false
            }
          }
          EOF
          cat > src-tauri/Cargo.toml <<'EOF'
          [package]
          name = "chatdemo"
          version = "VERSION_PLACEHOLDER"
          edition = "2024"

          [build-dependencies]
          tauri-build = { version = "2", features = [] }

          [dependencies]
          tauri = { version = "2", features = [] }
          tauri-plugin-opener = { version = "2", features = [] }

          [profile.release]
          codegen-units = 1
          lto = true
          opt-level = 3
          panic = "abort"
          strip = true
          EOF
          cat > src-tauri/build.rs <<'EOF'
          fn main() {
              tauri_build::build()
          }
          EOF
          cat > src-tauri/capabilities/default.json <<'EOF'
          {
            "$schema": "../gen/schemas/desktop-schema.json",
            "identifier": "default",
            "description": "Default capability for the main window",
            "windows": ["main"],
            "permissions": ["core:default", "opener:default"]
          }
          EOF
          cat > src-tauri/src/main.rs <<'EOF'
          #![cfg_attr(not(debug_assertions), windows_subsystem = "windows")]

          // Tauri 2 中 App::handle() 为固有方法，无需 use tauri::Manager
          use tauri::webview::{NewWindowResponse, PermissionResponse, WebviewWindowBuilder};
          use tauri_plugin_opener::OpenerExt;

          fn main() {
              tauri::Builder::default()
                  .plugin(tauri_plugin_opener::init())
                  .setup(|app| {
                      let handle = app.handle().clone();
                      WebviewWindowBuilder::new(app, "main", tauri::WebviewUrl::App("index.html".into()))
                          .title("Chat Demo")
                          .inner_size(1080.0, 760.0)
                          .min_inner_size(360.0, 480.0)
                          // 外链（含 Markdown 渲染的普通 <a href>）转系统浏览器，
                          // 不在窗口内导航走。初始页面加载也过此回调，必须放行应用自身 origin。
                          .on_navigation(move |url| {
                              let is_app = url.scheme() == "tauri"
                                  || url.host_str() == Some("tauri.localhost")
                                  || (tauri::is_dev()
                                      && (url.host_str() == Some("localhost")
                                          || url.host_str() == Some("127.0.0.1")));
                              if is_app {
                                  return true;
                              }
                              let _ = handle.opener().open_url(url.as_str(), None::<&str>);
                              false
                          })
                          // target=_blank / window.open 一律拦截，由 opener 插件 init script 接管
                          .on_new_window(|url, _features| {
                              let is_app = url.scheme() == "tauri"
                                  || url.host_str() == Some("tauri.localhost");
                              if is_app {
                                  NewWindowResponse::Allow
                              } else {
                                  NewWindowResponse::Deny
                              }
                          })
                  // 应用只可能请求麦克风（语音输入），直接允许，免 WebView2 原生提示
                  .on_permission_request(|_, _| PermissionResponse::Allow)
                          .build()?;
                      Ok(())
                  })
                  .run(tauri::generate_context!())
                  .expect("error while running tauri application");
          }
          EOF
          sed -i "s/VERSION_PLACEHOLDER/$VERSION/" src-tauri/tauri.conf.json src-tauri/Cargo.toml
          grep -n '"version"' src-tauri/tauri.conf.json
          grep -n '^version' src-tauri/Cargo.toml

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - name: Cache cargo
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: .tauri-pack/src-tauri

      - name: Build Tauri exe
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/.tauri-pack/src-tauri"
          ../node_modules/.bin/tauri build --no-bundle
          # 产物放到 workspace 根：upload-artifact 的 glob 不匹配点开头的隐藏目录段
          cp target/release/chatdemo.exe "$GITHUB_WORKSPACE/ChatDemo-${VERSION}-windows-x64.exe"
          ls -l "$GITHUB_WORKSPACE"/ChatDemo-*.exe

      - name: Upload exe artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-exe
          path: ChatDemo-*.exe
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Android APK：pnpm 构建静态站点 → CI 临时生成 Capacitor 工程 → gradle 打 debug APK
  # ---------------------------------------------------------------------------
  build-android-apk:
    name: Android APK (Capacitor)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve version
        id: version
        env:
          VERSION_INPUT: ${{ inputs.version }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag="$GITHUB_REF_NAME"
            if ! echo "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+-[0-9]{8}$'; then
              echo "::error::tag '$tag' 不符合格式 v<semver>-<YYYYMMDD>，例如 v1.0.0-20261116"
              exit 1
            fi
            version="${tag#v}"
            datecode="${tag##*-}"
            if ! date -d "${datecode:0:4}-${datecode:4:2}-${datecode:6:2}" >/dev/null 2>&1; then
              echo "::error::tag 日期段 '$datecode' 不是合法日期"
              exit 1
            fi
          else
            version="${VERSION_INPUT:-0.0.0-snapshot.${RUN_NUMBER}}"
            datecode="$(date +%Y%m%d)"
            if ! echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
              echo "::error::版本号 '$version' 不是合法 semver（示例：1.0.0-20261116）"
              exit 1
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "datecode=$datecode" >> "$GITHUB_OUTPUT"
          echo "构建版本：$version（versionCode/日期码：$datecode）"

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.6.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check types
        run: pnpm type

      - name: Lint
        run: pnpm lint

      - name: Build web app
        run: pnpm build

      - name: Set up JDK
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21

      - name: Scaffold Capacitor project
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cap-pack"
          cd "$RUNNER_TEMP/cap-pack"
          npm init -y >/dev/null
          npm install --no-fund --no-audit @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "io.github.lliangworld.chatdemo",
            "appName": "Chat Demo",
            "webDir": "www"
          }
          EOF
          mkdir -p www
          cp -r "$GITHUB_WORKSPACE/dist"/. www/
          # 诊断模式：向 www/index.html 注入诊断浮层（装机后屏幕顶部显示 frame 高度/
          # 视口单位实测值等指标，点击可折叠）。必须在 cap sync 之前注入才会进入 APK。
          if [ "${{ inputs.diagnostics }}" = "true" ]; then
            cat > diag.js <<'DIAGEOF'
            (function () {
              var TAG = 'chatdemo-diagnostics';
              if (document.getElementById(TAG)) { return; }

              function probe(value) {
                var el = document.createElement('div');
                el.style.position = 'fixed';
                el.style.left = '-9999px';
                el.style.height = value;
                document.body.appendChild(el);
                var h = getComputedStyle(el).height;
                el.remove();
                return h;
              }

              function metrics() {
                var frame = document.querySelector('#root > div');
                var root = document.getElementById('root');
                var cs = frame ? getComputedStyle(frame) : null;
                var rect = frame ? frame.getBoundingClientRect() : null;
                var vv = window.visualViewport;
                return [
                  'UA: ' + navigator.userAgent,
                  'matchMobile(<768): ' + matchMedia('not all and (min-width: 768px)').matches,
                  'innerWidth: ' + window.innerWidth + '  innerHeight: ' + window.innerHeight,
                  'documentElement.clientHeight: ' + document.documentElement.clientHeight,
                  'screen.height: ' + screen.height,
                  'visualViewport: ' + (vv ? vv.width + 'x' + vv.height + ' scale=' + vv.scale + ' offsetTop=' + vv.offsetTop : 'null'),
                  'CSS.supports dvh: ' + (window.CSS ? CSS.supports('height', '100dvh') : 'n/a') + ' | vh: ' + (window.CSS ? CSS.supports('height', '100vh') : 'n/a'),
                  'PROBE 100dvh => ' + probe('100dvh') + ' | 100vh => ' + probe('100vh') + ' | 100% => ' + probe('100%'),
                  'root height: ' + (root ? getComputedStyle(root).height : 'n/a'),
                  'frame height: ' + (cs ? cs.height : 'no-frame') + ' | position: ' + (cs ? cs.position : '-'),
                  'frame rect: ' + (rect ? 'top=' + Math.round(rect.top) + ' height=' + Math.round(rect.height) : 'no-frame'),
                  'frame inline style: ' + (frame ? (frame.getAttribute('style') || '(none)') : 'no-frame'),
                  'body height: ' + getComputedStyle(document.body).height
                ].join('\n');
              }

              function render() {
                var box = document.getElementById(TAG);
                if (!box) {
                  box = document.createElement('pre');
                  box.id = TAG;
                  box.setAttribute('data-expanded', '1');
                  box.style.cssText = 'position:fixed;left:0;right:0;top:0;z-index:2147483647;margin:0;padding:6px 8px;max-height:60%;overflow:auto;background:rgba(0,0,0,.85);color:#0f0;font:11px/1.45 monospace;white-space:pre-wrap;word-break:break-all;text-align:left';
                  box.addEventListener('click', function () {
                    if (box.getAttribute('data-expanded') === '1') {
                      box.setAttribute('data-expanded', '0');
                      box.style.maxHeight = '18px';
                      box.style.overflow = 'hidden';
                      box.style.whiteSpace = 'nowrap';
                    } else {
                      box.setAttribute('data-expanded', '1');
                      box.style.maxHeight = '60%';
                      box.style.overflow = 'auto';
                      box.style.whiteSpace = 'pre-wrap';
                    }
                  });
                  document.body.appendChild(box);
                }
                box.textContent = '[诊断浮层·点击折叠/展开] ' + new Date().toLocaleTimeString() + '\n' + metrics();
                console.log('[diagnostics] ' + new Date().toLocaleTimeString() + '\n' + metrics());
              }

              setInterval(render, 2000);
              if (document.readyState === 'complete') { render(); } else { window.addEventListener('load', render); }
            })();
          DIAGEOF
          node -e "const fs=require('fs');const p='www/index.html';let s=fs.readFileSync(p,'utf8');const d=fs.readFileSync('diag.js','utf8');if(!s.includes('chatdemo-diagnostics')){s=s.replace('</body>','<!--chatdemo-diagnostics--><script>'+d+'</script>\n</body>');}fs.writeFileSync(p,s);"
            grep -c 'chatdemo-diagnostics' www/index.html
          fi
          npx cap add android
          npx cap sync android

      - name: Apply launcher icons, permissions and version
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DATECODE: ${{ steps.version.outputs.datecode }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/cap-pack"
          cat > icon.svg <<'EOF'
          <svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
            <defs>
              <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#4f8cff"/>
                <stop offset="1" stop-color="#7c5cff"/>
              </linearGradient>
            </defs>
            <rect width="1024" height="1024" rx="220" fill="url(#g)"/>
            <rect x="248" y="264" width="528" height="380" rx="80" fill="#ffffff"/>
            <path d="M400 620 L400 760 L520 620 Z" fill="#ffffff"/>
            <circle cx="412" cy="454" r="34" fill="#4f8cff"/>
            <circle cx="512" cy="454" r="34" fill="#4f8cff"/>
            <circle cx="612" cy="454" r="34" fill="#4f8cff"/>
          </svg>
          EOF
          cat > icon-round.svg <<'EOF'
          <svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
            <defs>
              <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#4f8cff"/>
                <stop offset="1" stop-color="#7c5cff"/>
              </linearGradient>
            </defs>
            <circle cx="512" cy="512" r="512" fill="url(#g)"/>
            <rect x="248" y="264" width="528" height="380" rx="80" fill="#ffffff"/>
            <path d="M400 620 L400 760 L520 620 Z" fill="#ffffff"/>
            <circle cx="412" cy="454" r="34" fill="#4f8cff"/>
            <circle cx="512" cy="454" r="34" fill="#4f8cff"/>
            <circle cx="612" cy="454" r="34" fill="#4f8cff"/>
          </svg>
          EOF
          cat > icon-foreground.svg <<'EOF'
          <svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
            <g transform="translate(194.56 194.56) scale(0.62)">
              <rect x="248" y="264" width="528" height="380" rx="80" fill="#ffffff"/>
              <path d="M400 620 L400 760 L520 620 Z" fill="#ffffff"/>
              <circle cx="412" cy="454" r="34" fill="#4f8cff"/>
              <circle cx="512" cy="454" r="34" fill="#4f8cff"/>
              <circle cx="612" cy="454" r="34" fill="#4f8cff"/>
            </g>
          </svg>
          EOF
          npm install --no-fund --no-audit --no-save sharp-cli
          RES=android/app/src/main/res
          for spec in mdpi:48:108 hdpi:72:162 xhdpi:96:216 xxhdpi:144:324 xxxhdpi:192:432; do
            d="${spec%%:*}"; rest="${spec#*:}"; launcher="${rest%%:*}"; fg="${rest##*:}"
            npx --no-install sharp-cli -i icon.svg -o "$RES/mipmap-$d/ic_launcher.png" resize "$launcher" "$launcher"
            npx --no-install sharp-cli -i icon-round.svg -o "$RES/mipmap-$d/ic_launcher_round.png" resize "$launcher" "$launcher"
            npx --no-install sharp-cli -i icon-foreground.svg -o "$RES/mipmap-$d/ic_launcher_foreground.png" resize "$fg" "$fg"
          done
          bg="$RES/values/ic_launcher_background.xml"
          if [ -f "$bg" ]; then
            sed -i -E 's/>#[0-9A-Fa-f]{6,8}</>#4f8cff</' "$bg"
          else
            echo "::warning::未找到 $bg，跳过图标背景色替换"
          fi
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n</manifest>#' android/app/src/main/AndroidManifest.xml
          sed -i "s/versionCode 1/versionCode $DATECODE/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"$VERSION\"/" android/app/build.gradle
          grep -nE 'versionCode|versionName' android/app/build.gradle
          grep -n 'RECORD_AUDIO' android/app/src/main/AndroidManifest.xml

      - name: Build debug APK
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/cap-pack/android"
          ./gradlew assembleDebug --no-daemon
          cd ..
          cp android/app/build/outputs/apk/debug/app-debug.apk "ChatDemo-${VERSION}-android.apk"
          ls -l ChatDemo-*.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-apk
          path: ${{ runner.temp }}/cap-pack/ChatDemo-*.apk
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 发布：仅 tag 触发时执行，把两个产物上传到 GitHub Release
  # ---------------------------------------------------------------------------
  release:
    name: Publish GitHub Release
    if: github.ref_type == 'tag'
    needs: [build-tauri-exe, build-android-apk]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist-artifacts
          merge-multiple: true

      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ls -l dist-artifacts
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" --clobber dist-artifacts/*
          else
            gh release create "$TAG" --title "Chat Demo $TAG" --generate-notes dist-artifacts/*
          fi
